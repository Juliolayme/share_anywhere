name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common: &common
              - '.github/**'
              - 'docker-compose*.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
            backend:
              - *common
              - 'backend/**'
              - 'shared/**'
            web:
              - *common
              - 'web/**'
              - 'shared/**'
              - 'scripts/**'
              - 'design/**'
            shared:
              - *common
              - 'shared/**'
              - 'scripts/**'
              - 'design/**'
              - 'web/src/styles/tokens.*'
              - 'web/public/**'
              - 'android/app/src/main/res/**'
              - 'ios/ShareAnywhere/Assets.xcassets/**'
              - 'docs/API.md'
              - 'backend/oapi-codegen.yaml'
              - 'backend/internal/platform/api/**'
              - 'web/src/lib/api/**'
            docs:
              - *common
              - '**/*.md'
              - '.markdownlint*'

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Markdown lint
        run: pnpm lint:md
      - name: Relative link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --exclude-path node_modules --exclude-path design './**/*.md'
          fail: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --redact --verbose
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go vulnerability check
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: npm advisories (high and above)
        run: pnpm audit --audit-level high
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Build backend image for scanning
        run: docker build -t share-anywhere-backend:ci backend
      - name: Image scan (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress share-anywhere-backend:ci

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shareanywhere
          POSTGRES_USER: shareanywhere
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shareanywhere -d shareanywhere"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shareanywhere:ci-password@localhost:5432/shareanywhere?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - name: Coverage gate (devices and platform middleware >= 70 %)
        run: |
          fail=0
          for pkg in internal/devices internal/platform/access internal/platform/ratelimit internal/platform/clientip internal/platform/httpserver internal/platform/ws; do
            pct=$(go test -count=1 -cover ./$pkg | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')
            echo "$pkg: ${pct}%"
            awk -v p="$pct" 'BEGIN { exit !(p >= 70) }' || fail=1
          done
          exit $fail
      - name: Build image
        run: docker build -t share-anywhere-backend:ci .

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated design tokens, strings, and brand assets are current
        run: pnpm tokens:check && pnpm i18n:check && pnpm brand:check
      - name: Format
        run: pnpm --filter @share-anywhere/web format:check
      - name: Lint
        run: pnpm --filter @share-anywhere/web lint
      - name: Type check
        run: pnpm --filter @share-anywhere/web typecheck
      - name: Unit tests
        run: pnpm --filter @share-anywhere/web test
      - name: Build
        run: pnpm --filter @share-anywhere/web build
      - name: Bundle size budget (main JS gzip <= 120 kB)
        run: |
          size=$(find web/dist/assets -name 'index-*.js' -exec sh -c 'gzip -c "$1" | wc -c' _ {} \; | sort -n | tail -1)
          echo "main bundle gzip: $size bytes"
          test "$size" -le 122880
      - name: Build image
        run: docker build -f web/Dockerfile -t share-anywhere-web:ci .

  protocol:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Design tokens are valid, meet contrast, and generated files are current
        run: pnpm tokens:check
      - name: EN/VI catalogs match the design handoff
        run: pnpm i18n:check
      - name: Brand assets match the logo definition
        run: pnpm brand:check
      - name: Script tests
        run: pnpm test:scripts
      - name: OpenAPI valid, x-sa-access on every operation, agrees with docs/API.md, TS client current
        run: pnpm protocol:check
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go types generated from openapi.yaml are current
        working-directory: backend
        run: |
          go generate ./internal/platform/api/
          git diff --exit-code -- internal/platform/api/

  e2e-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium-desktop, browser: chromium }
          - { project: firefox-desktop, browser: firefox }
          - { project: webkit-desktop, browser: webkit }
          - { project: android-chrome, browser: chromium }
          - { project: ios-safari, browser: webkit }
    name: e2e-web (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack (postgres, backend, web, coturn, caddy)
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium and ${{ matrix.browser }}
        # The pairing specs always run the sender in Chromium, whatever the receiver project.
        run: pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Stock Firefox for WebRTC (pinned, checksum verified)
        # Playwright's patched Firefox never gathers ICE candidates; the Firefox project drives a stock
        # Firefox over WebDriver BiDi instead (docs/TESTING_AND_CI.md §3).
        if: matrix.browser == 'firefox'
        env:
          FIREFOX_VERSION: '160.0'
          FIREFOX_SHA256: fde774e9757c8878534c05ec210db592bf6a1b244c57941ffb2e364c04f35fcd
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firefox.tar.xz" "https://ftp.mozilla.org/pub/firefox/releases/${FIREFOX_VERSION}/linux-x86_64/en-US/firefox-${FIREFOX_VERSION}.tar.xz"
          echo "${FIREFOX_SHA256}  $RUNNER_TEMP/firefox.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          echo "E2E_FIREFOX_BIN=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/firefox/firefox" --version
      - name: Guest Playwright suite
        env:
          E2E_BASE_URL: http://localhost:8080
          # Firefox ICE logs for the open receiver-reload failure (docs/TESTING_AND_CI.md §3); uploaded with the results.
          MOZ_LOG: ${{ matrix.project == 'firefox-desktop' && 'timestamp,nr_ice:4,jsep:4,signaling:4' || '' }}
          # Not under test-results: Playwright empties that folder when the run starts, and Firefox creates no folders.
          MOZ_LOG_FILE: ${{ matrix.project == 'firefox-desktop' && format('{0}/web/moz-log/firefox', github.workspace) || '' }}
        run: |
          mkdir -p web/moz-log
          pnpm --filter @share-anywhere/web exec playwright test --project=${{ matrix.project }} --trace retain-on-failure
      - name: Upload report and traces (also when a test only passed on retry)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
            web/moz-log
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  compose:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: TURN credentials allocate on coturn; wrong and expired ones are refused
        working-directory: backend
        env:
          TURN_TEST_ADDR: 127.0.0.1:3478
          TURN_TEST_SECRET: ci-turn-secret
        run: go test -count=1 -run TestCredentialsAgainstCoturn -v ./internal/turncreds/
      - name: Smoke test through the edge proxy
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz | grep '"database":"ok"'
          curl -fsS http://localhost:8080/ | grep '<title>Share Anywhere</title>'
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
