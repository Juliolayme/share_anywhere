name: Nightly

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
  # Also when the nightly jobs themselves change, so a branch can prove them before they reach main
  # (scheduled and dispatched runs only exist for workflows on the default branch).
  push:
    paths:
      - '.github/workflows/nightly.yml'
      - 'web/e2e/nightly/**'
      - 'web/e2e/transfer/helpers.ts'
      - 'web/e2e/mobile/snapshots.spec.ts'

permissions:
  contents: read

jobs:
  large-file:
    # docs/TESTING_AND_CI.md §2.2: 2 GB Web-to-Web transfer with a receiver reload, final SHA-256, memory ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium
        run: pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium
      - name: Free disk check
        run: df -h /tmp .
      - name: 2 GB transfer
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_LARGE: '1'
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/nightly --project=chromium-desktop --retries=0 --trace retain-on-failure
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-large-file
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  mobile-snapshots:
    # Generates the mobile visual baselines on the runner (fonts must match CI) and uploads them to commit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium and webkit
        run: pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium webkit
      - name: Generate baselines
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SNAPSHOTS: '1'
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/mobile/snapshots.spec.ts --project=android-chrome --project=ios-safari --update-snapshots=all --retries=0
      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-snapshot-baselines
          if-no-files-found: error
          path: web/e2e/mobile/snapshots.spec.ts-snapshots
          retention-days: 14
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Remaining nightly jobs land with their phases
        run: |
          cat <<'TXT'
          Jobs still to be added by later phases (docs/TESTING_AND_CI.md section 2.2):
            Phase 4  five-receivers      one sender, five receivers, one throttled, sixth rejected
            Phase 6  android-matrix      emulator API 29 / 34 / 35, FGS time-budget simulation
            Phase 6  android-web-interop guest Android <-> Playwright transfers
            Phase 5B clipboard-cross-client encrypted clipboard Web <-> Android / iOS
            Phase 7  ios-matrix, ios-web-interop, ios-background-suspend
            Phase 8  turn-forced         relay-only transfers over UDP and TCP/TLS
            Phase 7  android-ios-interop best-effort, two half-tests against a shared ephemeral backend
          TXT
