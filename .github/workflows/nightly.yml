name: Nightly

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
  # Also when the nightly jobs themselves change, so a branch can prove them before they reach main
  # (scheduled and dispatched runs only exist for workflows on the default branch).
  push:
    paths:
      - '.github/workflows/nightly.yml'
      - 'web/e2e/nightly/**'
      - 'scripts/android-interop.sh'
      - 'scripts/android-clipboard-interop.sh'
      - 'scripts/ios-interop.sh'
      - 'scripts/ios-clipboard-interop.sh'
      - 'ios/Tests/ShareAnywhereUITests/**'
      - '.github/workflows/ios-simulator.yml'
      # The API 29 / 35 matrix re-checks instrumentation test changes made on a branch.
      - 'android/app/src/androidTest/**'
      - '.github/workflows/android-emulator.yml'
      - 'web/e2e/transfer/helpers.ts'
      - 'web/e2e/pairing/helpers.ts'
      - 'web/e2e/mobile/snapshots.spec.ts'

permissions:
  contents: read

jobs:
  large-file:
    # docs/TESTING_AND_CI.md §2.2: 2 GB Web-to-Web transfer with a receiver reload, final SHA-256, memory ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: scripts/turn-test-cert.sh && docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium
        # Runner apt mirrors fail intermittently ("Temporary failure resolving", "Some index files failed"); only
        # the dependency install is retried, never a test.
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Free disk check
        run: df -h /tmp .
      - name: 2 GB transfer
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_LARGE: '1'
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/nightly --project=chromium-desktop --retries=0 --trace retain-on-failure
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-large-file
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  turn-forced:
    # docs/TESTING_AND_CI.md §2.2, docs/phases/PHASE_8_ROUTE_TURN_CLOUD.md: relay-only Web transfers through the CI
    # coturn (host network, infra/coturn/turnserver.ci.conf) over UDP and over TLS with the "Using relay" badge, and a
    # direct path that stops mid-transfer migrating to the relay and resuming from the bitmap.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: scripts/turn-test-cert.sh && docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Forced relay and migration
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_TURN: '1'
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/nightly/turn-forced.spec.ts --project=chromium-desktop --retries=0 --trace retain-on-failure
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-turn-forced
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  abuse-soak:
    # docs/SECURITY_MODEL.md §3.2 and §5, docs/ADR/0031-abuse-soak.md: the in-process load generator
    # (backend/cmd/server/soak_test.go) at production limits and five times the default number of open sessions:
    # Sybil device creation, CGNAT, a distributed burst until protected mode trips, a slow attack just under the
    # alarm for one join window, a lone address; legitimate guests on other addresses during the attack.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shareanywhere
          POSTGRES_USER: shareanywhere
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shareanywhere -d shareanywhere"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shareanywhere:ci-password@localhost:5432/shareanywhere?sslmode=disable
      SOAK_SCALE: '5'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Abuse soak
        run: SOAK_REPORT="$RUNNER_TEMP/abuse-soak.json" go test -count=1 -v -run 'TestAbuseSoak|TestIDORSweep' ./cmd/server/
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abuse-soak
          path: ${{ runner.temp }}/abuse-soak.json
          if-no-files-found: ignore
          retention-days: 30

  mobile-snapshots:
    # Generates the mobile visual baselines on the runner (fonts must match CI) and uploads them to commit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: scripts/turn-test-cert.sh && docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium and webkit
        # Runner apt mirrors fail intermittently ("Temporary failure resolving", "Some index files failed"); only
        # the dependency install is retried, never a test.
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium webkit && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Generate baselines
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SNAPSHOTS: '1'
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/mobile/snapshots.spec.ts --project=android-chrome --project=ios-safari --update-snapshots=all --retries=0
      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-snapshot-baselines
          if-no-files-found: error
          path: web/e2e/mobile/snapshots.spec.ts-snapshots
          retention-days: 14
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  five-receivers:
    # docs/TESTING_AND_CI.md §2.2: one sender, five receivers (three Chromium, stock Firefox, WebKit), one slowed,
    # the other four finish first, a sixth join is refused.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: scripts/turn-test-cert.sh && docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium, firefox and webkit
        # Runner apt mirrors fail intermittently ("Temporary failure resolving", "Some index files failed"); only
        # the dependency install is retried, never a test.
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Stock Firefox for WebRTC (pinned, checksum verified)
        env:
          FIREFOX_VERSION: '160.0'
          FIREFOX_SHA256: fde774e9757c8878534c05ec210db592bf6a1b244c57941ffb2e364c04f35fcd
        run: |
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/firefox.tar.xz" "https://ftp.mozilla.org/pub/firefox/releases/${FIREFOX_VERSION}/linux-x86_64/en-US/firefox-${FIREFOX_VERSION}.tar.xz"
          echo "${FIREFOX_SHA256}  $RUNNER_TEMP/firefox.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          echo "E2E_FIREFOX_BIN=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
      - name: Five receivers
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_FIVE: '1'
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/nightly/five-receivers.spec.ts --project=chromium-desktop --retries=0 --trace retain-on-failure
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-five-receivers
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  android-web-interop:
    # docs/TESTING_AND_CI.md §2.4: Android emulator (API 34) <-> Playwright Chromium, a 64 MB fixture each way with
    # SHA-256 checks on both ends (scripts/android-interop.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start CI stack
        run: scripts/turn-test-cert.sh && docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Build the app and test APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pbackend=http://10.0.2.2:8080 --stacktrace
      - name: Interop both ways
        uses: reactivecircus/android-emulator-runner@v2.33.0
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
          INTEROP_DIR: ${{ runner.temp }}/interop
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-interop.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-web-interop
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
            ${{ runner.temp }}/interop
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  android-matrix:
    # docs/phases/PHASE_6_ANDROID.md: the instrumentation suite on API 29 and 35 (API 34 runs in ci.yml), including the
    # Android 15 dataSync time-budget simulation (FgsBudgetTest, API 35 only).
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    uses: ./.github/workflows/android-emulator.yml
    with:
      api-level: ${{ matrix.api-level }}

  clipboard-cross-client:
    # Encrypted Clipboard Sync between the Web app (Playwright Chromium) and the Android app on the emulator: the Web
    # pairs Android, each decrypts the other's item (scripts/android-clipboard-interop.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start CI stack
        run: scripts/turn-test-cert.sh && docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Build the app and test APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pbackend=http://10.0.2.2:8080 --stacktrace
      - name: Clipboard both ways
        uses: reactivecircus/android-emulator-runner@v2.33.0
        env:
          E2E_BASE_URL: http://localhost:8080
          CLIP_INTEROP_DIR: ${{ runner.temp }}/clipboard-interop
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-clipboard-interop.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-cross-client
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
            ${{ runner.temp }}/clipboard-interop
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Remaining nightly jobs land with their phases
        run: |
          cat <<'TXT'
          Jobs still to be added by later phases (docs/TESTING_AND_CI.md section 2.2): none.
          Not built (best effort in Phase 7, see docs/phases/reports/PHASE_7_REPORT.md):
            android-ios-interop  two half-tests against a shared ephemeral backend
          TXT

  ios-matrix:
    # docs/TESTING_AND_CI.md §2.2: the simulator suite on iPhone SE (3rd gen) and iPhone 16 Pro Max (latest runtime),
    # iPhone 16 on the oldest runtime at or above iOS 16, and an accessibility XXXL Dynamic Type run (ci.yml runs
    # iPhone 16 on the latest runtime). The macOS 15 image with Xcode 16.4 has no iPhone 15 simulators.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: 'iPhone SE (3rd generation)', runtime: latest, dynamic: '', artifact: matrix-se }
          - { device: 'iPhone 16 Pro Max', runtime: latest, dynamic: '', artifact: matrix-pro-max }
          - { device: 'iPhone 16', runtime: oldest, dynamic: '', artifact: matrix-oldest }
          # XXXL: the screenshot suite only (light and dark at that size); the flows run in the other entries, and at XXXL
          # rows of the lazy lists sit off screen where XCUITest cannot tap them.
          - { device: 'iPhone 16', runtime: latest, dynamic: UICTContentSizeCategoryAccessibilityXXXL, artifact: matrix-xxxl, only: ShareAnywhereUITests/ScreenshotUITests }
    uses: ./.github/workflows/ios-simulator.yml
    with:
      device: ${{ matrix.device }}
      runtime: ${{ matrix.runtime }}
      dynamic-type: ${{ matrix.dynamic }}
      artifact: ${{ matrix.artifact }}
      only-testing: ${{ matrix.only || '' }}

  ios-background-suspend:
    # ADR 0027: a receive paused by leaving the app (after the background-task grace period) resumes on return.
    uses: ./.github/workflows/ios-simulator.yml
    with:
      device: iPhone 16
      only-testing: ShareAnywhereUITests/TransferUITests/testLeavingTheAppPausesTheReceiveWhichResumesOnReturn
      artifact: background-suspend

  ios-web-interop:
    # docs/TESTING_AND_CI.md §2.4: the iOS app on the simulator <-> Playwright Chromium, a 64 MB file each way with SHA-256
    # checks on both ends (scripts/ios-interop.sh). macOS runners have no Docker: the backend runs natively and Caddy
    # serves the built Web app and proxies the API on http://localhost:8080, as the CI stack does.
    runs-on: macos-15
    timeout-minutes: 75
    env:
      DATABASE_URL: postgres://shareanywhere:ci-password@127.0.0.1:5432/shareanywhere?sslmode=disable
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 16 and Caddy (Homebrew)
        run: |
          brew install postgresql@16 caddy
          PG=$(brew --prefix postgresql@16)/bin
          echo "$PG" >> "$GITHUB_PATH"
          brew services start postgresql@16
          for i in $(seq 60); do "$PG/pg_isready" -h 127.0.0.1 && break; sleep 1; done
          "$PG/psql" -h 127.0.0.1 -d postgres -c "CREATE ROLE shareanywhere LOGIN PASSWORD 'ci-password';"
          "$PG/psql" -h 127.0.0.1 -d postgres -c "CREATE DATABASE shareanywhere OWNER shareanywhere;"
      - name: Backend (native, test hooks) behind Caddy with the built Web app
        run: |
          mkdir -p .tools
          (cd backend && go build -tags testhooks -o ../.tools/sa-server ./cmd/server)
          SA_ENV=test SA_HTTP_ADDR=127.0.0.1:8081 SA_LOG_LEVEL=info SA_MIGRATE_ON_START=true \
          SA_ALLOWED_ORIGINS=http://localhost:8080 SA_COOKIE_SECURE=false SA_RATE_LIMIT_MULTIPLIER=100 SA_POW_DIFFICULTY=8 \
          SA_PUBLIC_URL=http://localhost:8080 SA_TURN_SECRET=ci-turn-secret SA_MAIL_SINK=memory SA_TRUSTED_PROXIES=127.0.0.1/32 \
          SA_TURN_URIS="turn:127.0.0.1:3478?transport=udp" \
            nohup .tools/sa-server > backend.log 2>&1 &
          VITE_TEST_HOOKS=true pnpm --filter @share-anywhere/web build
          nohup caddy run --config infra/caddy/Caddyfile.macos --adapter caddyfile > caddy.log 2>&1 &
          for i in $(seq 60); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Install chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Pinned tools and project generation
        run: |
          scripts/ios-tools.sh
          (cd ios && "$GITHUB_WORKSPACE/.tools/xcodegen/bin/xcodegen" generate)
      - name: Boot the simulator
        id: sim
        run: |
          UDID=$(python3 scripts/ios-pick-simulator.py "iPhone 16" latest)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: xcodebuild build-for-testing
        run: |
          mkdir -p ios/build
          set -o pipefail
          xcodebuild build-for-testing -project ios/ShareAnywhere.xcodeproj -scheme ShareAnywhere \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath ios/build/DerivedData 2>&1 | tee ios/build/build.log \
            | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" ios/build/build.log
      - name: Interop both ways
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
          INTEROP_DIR: ${{ runner.temp }}/interop
        run: bash scripts/ios-interop.sh
      - name: Clipboard both ways (iOS half of clipboard-cross-client)
        if: always()
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          CLIP_INTEROP_DIR: ${{ runner.temp }}/clipboard-interop
        run: bash scripts/ios-clipboard-interop.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-web-interop
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
            ${{ runner.temp }}/interop
            ${{ runner.temp }}/clipboard-interop
            backend.log
            caddy.log
          retention-days: 7

