name: Nightly

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
  # Also when the nightly jobs themselves change, so a branch can prove them before they reach main
  # (scheduled and dispatched runs only exist for workflows on the default branch).
  push:
    paths:
      - '.github/workflows/nightly.yml'
      - 'web/e2e/nightly/**'
      - 'scripts/android-interop.sh'
      - 'scripts/android-clipboard-interop.sh'
      # The API 29 / 35 matrix re-checks instrumentation test changes made on a branch.
      - 'android/app/src/androidTest/**'
      - '.github/workflows/android-emulator.yml'
      - 'web/e2e/transfer/helpers.ts'
      - 'web/e2e/pairing/helpers.ts'
      - 'web/e2e/mobile/snapshots.spec.ts'

permissions:
  contents: read

jobs:
  large-file:
    # docs/TESTING_AND_CI.md §2.2: 2 GB Web-to-Web transfer with a receiver reload, final SHA-256, memory ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium
        # Runner apt mirrors fail intermittently ("Temporary failure resolving", "Some index files failed"); only
        # the dependency install is retried, never a test.
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Free disk check
        run: df -h /tmp .
      - name: 2 GB transfer
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_LARGE: '1'
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/nightly --project=chromium-desktop --retries=0 --trace retain-on-failure
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-large-file
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  mobile-snapshots:
    # Generates the mobile visual baselines on the runner (fonts must match CI) and uploads them to commit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium and webkit
        # Runner apt mirrors fail intermittently ("Temporary failure resolving", "Some index files failed"); only
        # the dependency install is retried, never a test.
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium webkit && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Generate baselines
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SNAPSHOTS: '1'
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/mobile/snapshots.spec.ts --project=android-chrome --project=ios-safari --update-snapshots=all --retries=0
      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-snapshot-baselines
          if-no-files-found: error
          path: web/e2e/mobile/snapshots.spec.ts-snapshots
          retention-days: 14
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  five-receivers:
    # docs/TESTING_AND_CI.md §2.2: one sender, five receivers (three Chromium, stock Firefox, WebKit), one slowed,
    # the other four finish first, a sixth join is refused.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium, firefox and webkit
        # Runner apt mirrors fail intermittently ("Temporary failure resolving", "Some index files failed"); only
        # the dependency install is retried, never a test.
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Stock Firefox for WebRTC (pinned, checksum verified)
        env:
          FIREFOX_VERSION: '160.0'
          FIREFOX_SHA256: fde774e9757c8878534c05ec210db592bf6a1b244c57941ffb2e364c04f35fcd
        run: |
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/firefox.tar.xz" "https://ftp.mozilla.org/pub/firefox/releases/${FIREFOX_VERSION}/linux-x86_64/en-US/firefox-${FIREFOX_VERSION}.tar.xz"
          echo "${FIREFOX_SHA256}  $RUNNER_TEMP/firefox.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          echo "E2E_FIREFOX_BIN=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
      - name: Five receivers
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_FIVE: '1'
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
        run: pnpm --filter @share-anywhere/web exec playwright test e2e/nightly/five-receivers.spec.ts --project=chromium-desktop --retries=0 --trace retain-on-failure
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-five-receivers
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  android-web-interop:
    # docs/TESTING_AND_CI.md §2.4: Android emulator (API 34) <-> Playwright Chromium, a 64 MB fixture each way with
    # SHA-256 checks on both ends (scripts/android-interop.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Build the app and test APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pbackend=http://10.0.2.2:8080 --stacktrace
      - name: Interop both ways
        uses: reactivecircus/android-emulator-runner@v2.33.0
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_FIXTURE_DIR: ${{ runner.temp }}/fixtures
          INTEROP_DIR: ${{ runner.temp }}/interop
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-interop.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-web-interop
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
            ${{ runner.temp }}/interop
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  android-matrix:
    # docs/phases/PHASE_6_ANDROID.md: the instrumentation suite on API 29 and 35 (API 34 runs in ci.yml), including the
    # Android 15 dataSync time-budget simulation (FgsBudgetTest, API 35 only).
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    uses: ./.github/workflows/android-emulator.yml
    with:
      api-level: ${{ matrix.api-level }}

  clipboard-cross-client:
    # Encrypted Clipboard Sync between the Web app (Playwright Chromium) and the Android app on the emulator: the Web
    # pairs Android, each decrypts the other's item (scripts/android-clipboard-interop.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 240
      - name: Install chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @share-anywhere/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Build the app and test APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pbackend=http://10.0.2.2:8080 --stacktrace
      - name: Clipboard both ways
        uses: reactivecircus/android-emulator-runner@v2.33.0
        env:
          E2E_BASE_URL: http://localhost:8080
          CLIP_INTEROP_DIR: ${{ runner.temp }}/clipboard-interop
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-clipboard-interop.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-cross-client
          if-no-files-found: ignore
          path: |
            web/playwright-report
            web/test-results
            ${{ runner.temp }}/clipboard-interop
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Remaining nightly jobs land with their phases
        run: |
          cat <<'TXT'
          Jobs still to be added by later phases (docs/TESTING_AND_CI.md section 2.2):
            Phase 7  clipboard-cross-client for iOS (Web <-> Android runs above)
            Phase 7  ios-matrix, ios-web-interop, ios-background-suspend
            Phase 8  turn-forced         relay-only transfers over UDP and TCP/TLS
            Phase 7  android-ios-interop best-effort, two half-tests against a shared ephemeral backend
          TXT
