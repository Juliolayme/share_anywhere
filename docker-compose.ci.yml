# CI and automated-test stack: plain HTTP on http://localhost:8080, no persistent volumes.
# docker compose -f docker-compose.ci.yml up -d --build --wait
name: share-anywhere-ci

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shareanywhere
      POSTGRES_USER: shareanywhere
      POSTGRES_PASSWORD: ci-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareanywhere -d shareanywhere"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        GO_TAGS: testhooks
    environment:
      SA_ENV: test
      SA_HTTP_ADDR: ":8080"
      SA_LOG_LEVEL: debug
      DATABASE_URL: postgres://shareanywhere:ci-password@postgres:5432/shareanywhere?sslmode=disable
      SA_ALLOWED_ORIGINS: http://localhost:8080
      SA_MIGRATE_ON_START: "true"
      SA_TRUSTED_PROXIES: 172.16.0.0/12
      # Plain HTTP on localhost: WebKit drops Secure cookies over http, so the test stack turns Secure off.
      SA_COOKIE_SECURE: "false"
      # All Playwright projects share one address; scale limits (test config, never off; SA_ENV=test only).
      SA_RATE_LIMIT_MULTIPLIER: "100"
      SA_POW_DIFFICULTY: "8"
      SA_PUBLIC_URL: http://localhost:8080
      SA_TURN_SECRET: ci-turn-secret
      # Reset mail stays in memory; specs read it with GET /v1/_test/mail/last (testhooks build).
      SA_MAIL_SINK: memory
      # UDP, TCP and TLS on the host-network coturn below (infra/coturn/turnserver.ci.conf, ADR 0029).
      SA_TURN_URIS: turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp,turns:127.0.0.1:5349?transport=tcp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_TEST_HOOKS: "true"

  # Host network, loopback only (infra/coturn/turnserver.ci.conf, ADR 0029): browsers, the iOS Simulator and the
  # Android emulator (10.0.2.2) reach it, and relay-to-relay traffic stays on 127.0.0.1. TURN over TLS needs the
  # certificate from scripts/turn-test-cert.sh in .tools/turn-tls (generated before `compose up`, never committed).
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=ci-turn-secret"]
    volumes:
      - ./infra/coturn/turnserver.ci.conf:/etc/coturn/turnserver.conf:ro
      - ./.tools/turn-tls:/etc/coturn/tls:ro

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./infra/caddy/Caddyfile.ci:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
