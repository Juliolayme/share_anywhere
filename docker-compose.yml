# Local development stack: docker compose up --build
# Web app at https://localhost:8443 (Caddy internal CA; accept the certificate or trust Caddy's root).
name: share-anywhere

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shareanywhere
      POSTGRES_USER: shareanywhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareanywhere -d shareanywhere"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      SA_ENV: development
      SA_HTTP_ADDR: ":8080"
      SA_LOG_LEVEL: ${SA_LOG_LEVEL:-info}
      DATABASE_URL: postgres://shareanywhere:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/shareanywhere?sslmode=disable
      SA_ALLOWED_ORIGINS: https://localhost:8443
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile

  coturn:
    image: coturn/coturn:4.6
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SHARED_SECRET:-dev-turn-secret-change-me}"]
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    ports:
      - "8443:8443"
    depends_on:
      - backend
      - web

volumes:
  pgdata:
  caddydata:
