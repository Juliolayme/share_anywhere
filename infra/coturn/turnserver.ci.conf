# coturn for CI and local relay tests only (docs/ADR/0029-turn-tls-and-test-relay.md). Never use in production:
# it relays only on the loopback interface and allows that single peer address, so relay-only clients on the
# same machine (browsers, the iOS Simulator, the Android emulator through 10.0.2.2) reach each other through
# coturn. infra/coturn/turnserver.conf is the production-shaped configuration that denies all private peers.
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3478
# TURN over TLS on its own port; the certificate is generated at run time (scripts/turn-test-cert.sh).
tls-listening-port=5349
cert=/etc/coturn/tls/turn.crt
pkey=/etc/coturn/tls/turn.key
realm=shareanywhere.local
use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
min-port=49160
max-port=49200
user-quota=6
# Relay usage per username for the guest relay byte cap (docs/SECURITY_MODEL.md section 5).
prometheus
prometheus-username-labels
# Loopback peers are refused by default; this test-only server relays nowhere else (listening and relay IPs
# are 127.0.0.1 and no other peer address is allowed).
allow-loopback-peers
allowed-peer-ip=127.0.0.1
log-file=stdout
simple-log
