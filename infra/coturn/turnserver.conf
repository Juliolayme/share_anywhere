# coturn configuration for Share Anywhere (development; the production-shaped peer rules). CI relay tests use
# turnserver.ci.conf instead (loopback peers allowed, docs/ADR/0029-turn-tls-and-test-relay.md).
# Credentials are time-limited HMAC credentials issued by the backend (use-auth-secret).
# The shared secret is passed on the command line from TURN_SHARED_SECRET; never commit it.
listening-port=3478
# TURN over TLS (ADR 0029): coturn terminates TLS itself. Production: port 443 on an address of its own (not Caddy's),
# with a real certificate for the TURN host, and `turns:<host>:443?transport=tcp` in SA_TURN_URIS. Development uses
# 5349 with the self-signed certificate from scripts/turn-test-cert.sh (mounted at /etc/coturn/tls); without the files
# coturn starts with UDP/TCP only.
tls-listening-port=5349
cert=/etc/coturn/tls/turn.crt
pkey=/etc/coturn/tls/turn.key
# Relay usage per username for the relay byte cap per session (docs/SECURITY_MODEL.md section 5): the backend reads
# this exporter (SA_TURN_METRICS_URL). Keep port 9641 on an internal network only. Ephemeral usernames add one
# series each; restart coturn periodically (ADR 0029, Consequences).
prometheus
prometheus-username-labels
realm=shareanywhere.local
use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Relay range kept small for local Docker; production widens it and opens the firewall.
min-port=49160
max-port=49200
# Per-username allocation quota (docs/SECURITY_MODEL.md section 5 / docs/ARCHITECTURE.md section 6).
user-quota=6
# Block relaying to private and loopback ranges so TURN cannot be used to reach internal services.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=::
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
