# coturn configuration for Share Anywhere (development and CI).
# Credentials are time-limited HMAC credentials issued by the backend (use-auth-secret).
# The shared secret is passed on the command line from TURN_SHARED_SECRET; never commit it.
listening-port=3478
# TLS (TURN over TLS 443) needs a certificate and is configured in Phase 8 (docs/phases/PHASE_8_ROUTE_TURN_CLOUD.md).
realm=shareanywhere.local
use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Relay range kept small for local Docker; production widens it and opens the firewall.
min-port=49160
max-port=49200
# Per-username allocation quota (docs/SECURITY_MODEL.md section 5 / docs/ARCHITECTURE.md section 6).
user-quota=6
# Block relaying to private and loopback ranges so TURN cannot be used to reach internal services.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
