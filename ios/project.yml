# XcodeGen project (CLAUDE.md §5, docs/ADR/0022): `xcodegen generate` in ios/ writes ShareAnywhere.xcodeproj, which
# is not committed. iOS 16 minimum, SwiftPM only, no signing material (simulator builds are signed ad hoc).
name: ShareAnywhere
options:
  bundleIdPrefix: app.shareanywhere
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Simulator builds are signed ad hoc ("Sign to Run Locally": no certificate, no team), which gives the app its
    # Keychain entitlement on the simulator. Device builds need a team and are out of scope in CI (docs/ADR/0022).
    CODE_SIGN_STYLE: Manual
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      # The simulator reaches the native CI backend on the host (docs/TESTING_AND_CI.md §2.3).
      SA_BACKEND_URL: http://127.0.0.1:8080
      SA_PUBLIC_URL: ""
    Release:
      # Release builds need a real HTTPS origin: xcodebuild SA_BACKEND_URL=https://… (APIClient refuses http).
      SA_BACKEND_URL: ""
      SA_PUBLIC_URL: ""
packages:
  ShareAnywhereCore:
    path: ShareAnywhereCore
  # WebRTC DataChannel transport (docs/ADR/0026-ios-webrtc-dependency.md): a binary xcframework, pinned exactly;
  # SwiftPM verifies its checksum from the package manifest.
  StreamWebRTC:
    url: https://github.com/GetStream/stream-video-swift-webrtc.git
    exactVersion: 145.25.0
targets:
  ShareAnywhere:
    type: application
    platform: iOS
    sources:
      - path: ShareAnywhere
    dependencies:
      - package: ShareAnywhereCore
        product: Protocol
      - package: ShareAnywhereCore
        product: TransferEngine
      - package: ShareAnywhereCore
        product: ClipboardCrypto
      - package: ShareAnywhereCore
        product: APIClient
      - package: ShareAnywhereCore
        product: Store
      - package: ShareAnywhereCore
        product: TransferRuntime
      - package: ShareAnywhereCore
        product: Account
      - package: StreamWebRTC
        product: StreamWebRTC
    info:
      path: ShareAnywhere/Info.plist
      properties:
        CFBundleDisplayName: Share Anywhere
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        SABackendURL: $(SA_BACKEND_URL)
        SAPublicURL: $(SA_PUBLIC_URL)
        # Received files land in Documents, which Files shows as On My iPhone › Share Anywhere.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Scan the sender’s QR code to receive files. The camera is used only while the scanner is open.
        # Home Screen quick action that opens the Clipboard tab (docs/phases/PHASE_7_IOS.md).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.shareanywhere.clipboard
            UIApplicationShortcutItemTitle: Clipboard
            UIApplicationShortcutItemIconSymbolName: doc.on.clipboard
        ITSAppUsesNonExemptEncryption: false
        # Plain HTTP only to the local CI backend (127.0.0.1); every other origin must be HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shareanywhere
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  ShareAnywhereTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ShareAnywhereTests
    dependencies:
      - target: ShareAnywhere
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.shareanywhere.tests
  ShareAnywhereUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ShareAnywhereUITests
      # The test runner acts as the other device (a receiver or sender) with the same runtime and WebRTC adapter.
      - path: ShareAnywhere/Transfer/WebRTCPeer.swift
    dependencies:
      - target: ShareAnywhere
      - package: ShareAnywhereCore
        product: TransferRuntime
      - package: ShareAnywhereCore
        product: Account
      - package: StreamWebRTC
        product: StreamWebRTC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.shareanywhere.uitests
        TEST_TARGET_NAME: ShareAnywhere
schemes:
  ShareAnywhere:
    build:
      targets:
        ShareAnywhere: all
        ShareAnywhereTests: [test]
        ShareAnywhereUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ShareAnywhereTests
        - ShareAnywhereUITests
