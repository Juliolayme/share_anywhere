openapi: 3.0.3
info:
  title: Share Anywhere API
  version: 0.1.0
  x-sa-api-sections: ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6"]
  description: |
    Machine-readable contract. Every operation declares `x-sa-access` (public, device, participant,
    account, account+device), which must match docs/API.md and is enforced by the backend
    (docs/SECURITY_MODEL.md, CLAUDE.md §7). Phase 1 covers health and anonymous device identity; Phase 5A
    adds accounts, the account Devices list, account keys (opaque wrapped blobs), and encrypted history;
    Phase 5B adds Clipboard Sync (end-to-end encrypted text events, settings).
servers:
  - url: /
security:
  - deviceToken: []
paths:
  /healthz:
    get:
      operationId: getHealth
      x-sa-access: public
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReady
      x-sa-access: public
      security: []
      responses:
        "200":
          description: Dependencies are ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
  /v1/devices/anonymous/challenge:
    get:
      operationId: getDeviceChallenge
      x-sa-access: public
      security: []
      summary: Proof-of-work challenge for anonymous device creation.
      responses:
        "200":
          description: A challenge bound to the caller's address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PowChallenge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/devices/anonymous:
    post:
      operationId: createAnonymousDevice
      x-sa-access: public
      security: []
      summary: Create an anonymous device identity (guest-first; no account).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeviceRequest" }
      responses:
        "201":
          description: Device created. With transport "cookie" the refresh secret is set as the sa_device cookie and omitted from the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "428":
          description: The caller's address is above the soft limit; solve the included challenge and retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PowRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/devices/token:
    post:
      operationId: refreshDeviceToken
      x-sa-access: public
      security: []
      summary: Rotate the refresh secret and issue a new access token.
      description: >-
        Native clients send refresh_secret in the body. Web clients send the sa_device cookie and must send X-SA-Refresh 1.
        acct and dl are re-derived from the device's live account session. A not-added account session started from a Web
        device is bound to the browser session: the sa_acct cookie (set at sign-in, same path, no Max-Age) must match, or the
        account session ends and the token is a guest token; the response then expires sa_acct (docs/ADR/0013-session-hardening.md).
        Presenting a refresh secret that was already used or retired revokes the device (401 refresh_reused).
      parameters:
        - in: header
          name: X-SA-Refresh
          schema: { type: string, enum: ["1"] }
          required: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New access token; the refresh secret was rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cookie refresh without the X-SA-Refresh header.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/devices/current:
    get:
      operationId: getCurrentDevice
      x-sa-access: device
      responses:
        "200":
          description: This device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateCurrentDevice
      x-sa-access: device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeviceRequest" }
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/devices/current/reset:
    post:
      operationId: resetCurrentDevice
      x-sa-access: device
      summary: Revoke this device identity and issue a new anonymous one.
      description: No request body. The new identity keeps the refresh transport the old device was created with.
      responses:
        "201":
          description: New anonymous identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/ws/ticket:
    post:
      operationId: createWsTicket
      x-sa-access: device
      responses:
        "201":
          description: One-time WebSocket ticket valid for 30 seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WsTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/ws:
    get:
      operationId: connectWebSocket
      x-sa-access: public
      security: []
      summary: WebSocket upgrade, authenticated by a one-time ticket and an Origin check.
      parameters:
        - in: query
          name: ticket
          required: true
          schema: { type: string }
      responses:
        "101":
          {
            description: Switching protocols. Events are described in shared/protocol/websocket-events.json.,
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Origin not allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions:
    get:
      operationId: listOpenSessions
      x-sa-access: device
      summary: The caller device's live sessions as sender (WAITING or ACTIVE, before their maximum lifetime), newest first - exactly what the open-session cap counts. Never includes codes or links.
      responses:
        "200":
          description: Open sessions owned by the calling device (at most 20; the open-session cap keeps it at 2 for guests, 5 signed in).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenSessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSession
      x-sa-access: device
      summary: Create a share session (guest or signed in) with a six-digit code, link and QR sharing one 10-minute join window.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Session created; the sender view includes the code, link token and join URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getSession
      x-sa-access: participant
      summary: The session as the caller may see it (sender, joined receiver, requested receiver, ended participant).
      responses:
        "200":
          description: Session view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSession
      x-sa-access: participant
      summary: Sender only. Toggle Require approval (future joins) or Stop accepting (accepting_receivers false).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSessionRequest" }
      responses:
        "200":
          description: Updated sender view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
  /v1/sessions/{id}/close:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: closeSession
      x-sa-access: participant
      summary: Sender only. End the session; receivers get SESSION_CLOSED.
      responses:
        "200": { description: Closed (idempotent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/sessions/{id}/renew:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: renewSession
      x-sa-access: participant
      summary: Sender only. Create new code - new code, link and QR, fresh 10-minute window; the old ones stop working.
      responses:
        "200":
          description: Sender view with the new code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/resolve-code:
    post:
      operationId: resolveCode
      x-sa-access: device
      summary: Look up a six-digit code. Counts toward code lookup and failed-lookup limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Preview and a single-use join ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/resolve-link:
    post:
      operationId: resolveLink
      x-sa-access: device
      summary: Look up a link or QR token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 22, maxLength: 128 }
      responses:
        "200":
          description: Preview and a single-use join ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/{id}/join:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: joinSession
      x-sa-access: device
      summary: Join with a ticket. JOINED in open-join sessions; REQUESTED when approval is on or protected mode applies to a code join.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              additionalProperties: false
              properties:
                ticket: { type: string }
      responses:
        "200":
          description: The caller's participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/participants/{id}/approve:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: approveParticipant
      x-sa-access: participant
      summary: Sender only, REQUESTED participants.
      responses:
        "200":
          description: The updated participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/participants/{id}/reject:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: rejectParticipant
      x-sa-access: participant
      summary: Sender only, REQUESTED participants.
      responses:
        "200":
          description: The updated participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/participants/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      operationId: removeParticipant
      x-sa-access: participant
      summary: Sender only. Remove a receiver; revokes its access and frees the slot.
      responses:
        "200":
          description: The updated participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/participants/{id}/block:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: blockParticipant
      x-sa-access: participant
      summary: Sender only. Remove and refuse rejoin from that device and IP /64 for the session.
      responses:
        "200":
          description: The updated participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/participants/{id}/leave:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: leaveSession
      x-sa-access: participant
      summary: That receiver only.
      responses:
        "200":
          description: The updated participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/turn/credentials:
    post:
      operationId: createTurnCredentials
      x-sa-access: participant
      summary: Time-limited coturn credentials for the sender or a JOINED receiver of an ACTIVE session (guest 30 min, account 60 min).
      description: >-
        Refused with 403 relay_cap_reached once the session's relay traffic, read from coturn's usage per participant,
        reaches the cap for its sender (25 GB guest, 100 GB signed in; docs/SECURITY_MODEL.md section 5). Clients then
        keep only direct connections and tell the user why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              additionalProperties: false
              properties:
                session_id: { type: string, format: uuid }
      responses:
        "200":
          description: ICE server credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnCredentials" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/{id}/files:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: listSessionFiles
      x-sa-access: participant
      summary: Sender or JOINED receiver.
      responses:
        "200":
          description: Files in the session.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/SharedFile" },
                    }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/sessions/{id}/transfers:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: listTransfers
      x-sa-access: participant
      summary: Sender sees every transfer and each receiver's capability hash; a JOINED receiver sees its own transfers and its transfer capability.
      responses:
        "200":
          description: Transfers in the session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/transfers/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getTransfer
      x-sa-access: participant
      summary: The sender or that transfer's JOINED receiver.
      responses:
        "200":
          description: The transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/transfers/{id}/report:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: reportTransfer
      x-sa-access: participant
      summary: State, verified bytes and route from the client engine. Transitions are validated; only the receiver completes, with every byte verified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferReport" }
      responses:
        "200":
          description: The updated transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/transfers/{id}/pause:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: pauseTransfer
      x-sa-access: participant
      summary: Pause from any active state.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferAction" }
      responses:
        "200":
          description: The updated transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/transfers/{id}/resume:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: resumeTransfer
      x-sa-access: participant
      summary: Resume a paused transfer; a receiver must send its transfer capability.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferAction" }
      responses:
        "200":
          description: The updated transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/transfers/{id}/cancel:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: cancelTransfer
      x-sa-access: participant
      summary: Cancel; terminal.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferAction" }
      responses:
        "200":
          description: The updated transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/auth/signup:
    post:
      operationId: signUp
      x-sa-access: device
      summary: Create an account and bind an account session to the calling device (device ID unchanged).
      description: >-
        Fails with 409 already_signed_in when the device already has an account session. Rate limited per IP and per device
        (docs/SECURITY_MODEL.md §5). With add_device false on a Web (cookie-transport) device the response also sets the
        browser-session cookie sa_acct (HttpOnly, SameSite=Strict, Path=/v1/devices/token, no Max-Age) that every refresh
        must present; otherwise a Web response expires any sa_acct. Native devices get no cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialsRequest" }
      responses:
        "201":
          description: Account created. The access token carries acct and, when add_device is true, dl.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400":
          description: invalid_request, invalid_email, or weak_password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: email_taken or already_signed_in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/signin:
    post:
      operationId: signIn
      x-sa-access: device
      summary: Verify email and password and bind an account session to the calling device (device ID unchanged).
      description: >-
        An unknown email gets the same 401 invalid_credentials as a wrong password, after the same Argon2id work. Rate limited
        per IP + email, per IP, per device, and failed attempts per email. With add_device false on a Web (cookie-transport)
        device the response also sets the browser-session cookie sa_acct (as for sign-up); otherwise a Web response expires
        any sa_acct.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialsRequest" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: invalid_credentials, or an invalid device token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: already_signed_in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/signout:
    post:
      operationId: signOut
      x-sa-access: account
      summary: End the account session, remove the device from the account, revoke this device identity, and return a brand-new anonymous identity.
      description: No request body. Web devices get the new refresh secret as a new sa_device cookie and sa_acct expired; native devices get refresh_secret in the body (the old device's transport).
      responses:
        "200":
          description: The new anonymous identity (new device ID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      x-sa-access: public
      security: []
      summary: Email a single-use reset link (30 minutes) if the address has an account. Always 202.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "202": { description: Accepted; the response never says whether the account exists. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      x-sa-access: public
      security: []
      summary: Set a new password with a reset token; ends every account session of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 128 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Password changed. }
        "400":
          description: reset_token_invalid (unknown, used, or expired), weak_password, or invalid_request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/me:
    get:
      operationId: getMe
      x-sa-access: account
      responses:
        "200":
          description: The signed-in account as seen from this device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateMe
      x-sa-access: account+device
      summary: Change account settings visible to every device. A not-added device is read-only (403 device_not_added).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                history_sync: { type: boolean }
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/me/password:
    post:
      operationId: changePassword
      x-sa-access: account
      summary: Change the password; ends the account sessions of every other device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string, maxLength: 512 }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Password changed. }
        "400":
          description: weak_password or invalid_request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: invalid_credentials (wrong current password; 403 so clients do not treat it as an expired token) or account_required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/devices/current/add:
    post:
      operationId: addCurrentDevice
      x-sa-access: account
      summary: Add the calling device to its account (dl becomes true; the account session slides to 90 days). Idempotent.
      description: Drops the browser-session binding; a Web response expires the sa_acct cookie.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                copy_history:
                  {
                    type: boolean,
                    description: The client imports its local history with POST /v1/history/entries; the server only accepts the flag.,
                  }
      responses:
        "200":
          description: New access token with dl true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/devices:
    get:
      operationId: listAccountDevices
      x-sa-access: account
      summary: Devices with a live account session for this account, current device first.
      responses:
        "200":
          description: Account devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/AccountDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/devices/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: renameAccountDevice
      x-sa-access: account+device
      summary: Rename one of this account's devices. A not-added device is read-only (403 device_not_added).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "200":
          description: The renamed device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDevice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: revokeAccountDevice
      x-sa-access: account+device
      summary: Revoke another device - end its account session and remove it from the account (it keeps its guest identity). The caller then rotates the ADK.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: use_signout (the current device signs out instead).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/keys:
    get:
      operationId: getKeys
      x-sa-access: account+device
      summary: Account key state - current ADK version, recovery metadata, every added device's wrapping key, rotation blobs pending for the caller, and whether a rotation is owed.
      responses:
        "200":
          description: Key state (public keys and opaque blobs only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeysState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/keys/device:
    put:
      operationId: registerDeviceKey
      x-sa-access: account+device
      summary: Register (or replace) the caller's X25519 wrapping public key with a proof that the device holds ADK(key_version). Replacing it drops pending blobs wrapped to the old key.
      description: >-
        proof is an Ed25519 signature by the signing key of ADK(key_version) over
        "sa-devkey-v1|" + caller device ID (lowercase UUID, from the token) + "|" + key_version + "|" + b64u(public_key)
        (docs/CLIPBOARD_PROTOCOL.md §1). A device can register only once it holds the ADK (setup, pairing, or recovery), and
        only with a proof by the account's current version (docs/ADR/0014-current-version-proofs.md): after a rotation each
        device registers again with a proof by the new version, and a device holding only older versions must pair again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, key_version, proof]
              additionalProperties: false
              properties:
                public_key: { $ref: "#/components/schemas/PublicKey" }
                key_version: { type: integer, minimum: 1, description: "The account's current ADK version, which the device holds." }
                proof: { $ref: "#/components/schemas/Signature" }
      responses:
        "204": { description: Registered. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: device_key_unproven (the account has no ADK yet, or the proof does not verify with verify_key(key_version) for the caller's device ID), account_required, or device_not_added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: key_version_conflict (key_version is not the account's current version; nothing stored) or keys_legacy (the account's keys predate key verification).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/keys/setup:
    post:
      operationId: setupKeys
      x-sa-access: account+device
      summary: Record ADK version 1 wrapped to the recovery public key, with the recovery salt and Argon2id parameters, verify_key(1), the recovery anchor, and the signature by version 1 over the recovery public key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeysSetupRequest" }
      responses:
        "201":
          description: Key version 1 recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: recovery_key_unverified (recovery_key_signature does not verify with verify_key over "sa-recoverykey-v1|" + b64u(recovery_public_key); nothing stored), account_required, or device_not_added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: keys_exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/keys/recovery:
    get:
      operationId: getRecoveryBlob
      x-sa-access: account+device
      summary: The newest ADK wrapped to the recovery public key, with salt and parameters.
      responses:
        "200":
          description: Recovery-wrapped ADK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryBlob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/keys/rotate:
    post:
      operationId: rotateKeys
      x-sa-access: account+device
      summary: Record ADK version current+1 atomically, signed by the current version, wrapped for exactly the other added devices whose registered proof is by the current version (the caller may add a safety copy for itself). Clears rotation_due.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeysRotateRequest" }
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: rotation_unauthorized (signature does not verify with the stored verify_key of the current version; nothing stored), device_key_unproven (the caller's own wrapping key is not registered and proven at the current version; nothing stored), account_required, or device_not_added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            key_version_conflict, keys_legacy (the account's keys predate key verification), or devices_changed (the blobs do not
            match the devices that must get one; nothing stored). A devices_changed body is a DevicesChanged
            (#/components/schemas/DevicesChanged) and always carries both missing and unexpected; the other codes carry an Error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/keys/chain:
    get:
      operationId: getKeyChain
      x-sa-access: account+device
      summary: Chain blobs (for version v, ADK(v-1) wrapped with ADK(v)) and every version's verify key and authorizing signature, oldest first.
      responses:
        "200":
          description: Chain and version list.
          content:
            application/json:
              schema:
                type: object
                required: [chain, versions]
                properties:
                  chain:
                    type: array
                    items: { $ref: "#/components/schemas/ChainLink" }
                  versions:
                    type: array
                    description: Versions 1..current, ascending.
                    items: { $ref: "#/components/schemas/KeyVersionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/keys/pending/{key_version}:
    parameters:
      - {
          name: key_version,
          in: path,
          required: true,
          schema: { type: integer, minimum: 1 },
        }
    delete:
      operationId: ackPendingKey
      x-sa-access: account+device
      summary: Acknowledge (delete) a rotation blob the caller has stored. Idempotent.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/keys/pairings:
    post:
      operationId: createPairing
      x-sa-access: account+device
      summary: New device starts a pairing (replacing any earlier one). The code is 128 random bits, valid 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ephemeral_public_key]
              additionalProperties: false
              properties:
                ephemeral_public_key: { $ref: "#/components/schemas/PublicKey" }
      responses:
        "201":
          description: Pairing created; show code as QR and pasteable text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pairing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/keys/pairings/{pairing_id}:
    parameters:
      - {
          name: pairing_id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getPairingResult
      x-sa-access: account+device
      summary: New device (owner only) polls the pairing. The wrapped blob is returned once; the pairing then reports expired.
      responses:
        "200":
          description: Pairing status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/keys/pairings/by-code/{code}:
    parameters:
      - {
          name: code,
          in: path,
          required: true,
          schema: { type: string, maxLength: 64 },
        }
    get:
      operationId: lookupPairing
      x-sa-access: account+device
      summary: Existing device resolves a pairing code of the same account. Expired, used, other-account, and own codes are 404.
      responses:
        "200":
          description: The new device's ephemeral key and name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingPeer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/keys/pairings/by-code/{code}/wrap:
    parameters:
      - {
          name: code,
          in: path,
          required: true,
          schema: { type: string, maxLength: 64 },
        }
    post:
      operationId: wrapPairing
      x-sa-access: account+device
      summary: Existing device uploads the newest ADK wrapped for the new device. Accepted once. sender_public_key must be the caller's registered (proven) wrapping key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingWrapRequest" }
      responses:
        "204": { description: Stored for one-time pickup. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: device_key_unproven (sender_public_key is not the caller's registered wrapping key), account_required, or device_not_added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: key_version_conflict (key_version is not the account's current version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/history/entries:
    get:
      operationId: listHistoryEntries
      x-sa-access: account+device
      summary: Entries and tombstones with seq greater than after, in seq order.
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: A page; resume with next_after.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createHistoryEntry
      x-sa-access: account+device
      summary: Store an encrypted entry. Idempotent on entry_id (the original seq is returned).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistoryEntryRequest" }
      responses:
        "201":
          description: Stored (or already stored).
          content:
            application/json:
              schema:
                type: object
                required: [seq]
                properties:
                  seq: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: key_version_conflict (key_version is not the account's current version; nothing stored. The client picks up the new key and retries).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/history/entries/{entry_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        description: Lowercase canonical 8-4-4-4-12 form (400 invalid_request otherwise).
        schema: { type: string, format: uuid, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
    delete:
      operationId: deleteHistoryEntry
      x-sa-access: account+device
      summary: Turn an entry into a tombstone with a new seq (deleting a tombstone again changes nothing).
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/history:
    delete:
      operationId: clearHistory
      x-sa-access: account+device
      summary: Tombstone every live entry of the account, each with a new seq.
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/clipboard/events:
    get:
      operationId: listClipboardEvents
      x-sa-access: account+device
      summary: Events and tombstones with seq greater than cursor, in seq order; records cursor as what this device has applied.
      description: |
        The call records the calling device's cursor (the cursor it sent, i.e. what it has applied) in
        clipboard_device_cursors; the recorded cursor never moves backwards and never passes the account's highest
        seq. Live events past expires_at are left out. Clients call this on every CLIPBOARD_* WebSocket message and
        on reconnect. Limited per device to 600 / min, shared with GET /v1/clipboard/history.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: A page; resume with next_cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipboardEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createClipboardEvent
      x-sa-access: account+device
      summary: Store an encrypted clipboard event. Idempotent on event_id (the stored seq is returned).
      description: |
        Repeating an event_id returns the stored seq, created_at, and expires_at and changes nothing (a deleted
        event is not restored). A new event must use the account's current key_version. Inserting beyond 100 live
        events tombstones the oldest live one in the same transaction. expires_at is created_at plus the account's
        retention (default 7 days). Limited per device (60 / min) and per account (240 / min).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClipboardEventRequest" }
      responses:
        "201":
          description: Stored (or already stored).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipboardEventCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: key_version_conflict (key_version is not the account's current version) or clipboard_paused (the account paused Clipboard Sync). Nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: payload_too_large (payload_size above 262144, ciphertext above 262160 bytes, or a body too large to hold them).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/clipboard/events/{event_id}:
    parameters:
      - name: event_id
        in: path
        required: true
        description: Lowercase canonical 8-4-4-4-12 form (400 invalid_request otherwise).
        schema: { type: string, format: uuid, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
    delete:
      operationId: deleteClipboardEvent
      x-sa-access: account+device
      summary: Turn an event into a tombstone with a new seq (deleting a tombstone again changes nothing).
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/clipboard/history:
    get:
      operationId: getClipboardHistory
      x-sa-access: account+device
      summary: Live events, newest first, with the account's current highest seq for the initial load.
      description: Read from one snapshot. The client then follows GET /v1/clipboard/events?cursor=<cursor>. Limited per device to 600 / min, shared with GET /v1/clipboard/events.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: The live events and the cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipboardHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: clearClipboardHistory
      x-sa-access: account+device
      summary: Tombstone every live event of the account, each with a new seq.
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/clipboard/settings:
    get:
      operationId: getClipboardSettings
      x-sa-access: account+device
      summary: The account's clipboard settings (defaults until stored - paused false, retention_days 7, sensitive_skip true).
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipboardSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putClipboardSettings
      x-sa-access: account+device
      summary: Replace the account's clipboard settings (all fields required). A new retention applies to events created afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClipboardSettings" }
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClipboardSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/cloud/settings:
    get:
      operationId: getCloudSettings
      x-sa-access: device
      summary: Whether Cloud Distribution is available, and the signed-in account's consent, budget and usage (docs/API.md §2.6).
      responses:
        "200":
          description: Availability and settings (zero values for guests).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: putCloudSettings
      x-sa-access: account
      summary: Turn Cloud Distribution on (explicit consent the first time) or off and set the monthly budget.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudSettingsInput" }
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cloud/estimate:
    post:
      operationId: estimateCloud
      x-sa-access: account
      summary: Temporary storage, receiver egress, retention and the cost from configured pricing (null when unknown) before consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bytes, receivers]
              additionalProperties: false
              properties:
                bytes: { type: integer, format: int64, minimum: 0 }
                receivers: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudEstimate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/files/{id}/distribute:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: distributeFile
      x-sa-access: device
      summary: Start Cloud Distribution of a shared file. The session's sender, signed in, enabled and consented, within budget; idempotent per file.
      description: >-
        Device level so that a guest gets 403 cloud_requires_account (docs/PRODUCT_REQUIREMENTS.md section 6.6); no consent
        gives 403 cloud_consent_required and a used-up budget 403 cloud_budget_exhausted.
      responses:
        "200":
          description: The live object of this file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudObject" }
        "201":
          description: A new object, uploading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/cloud/objects/{id}/parts/{n}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          name: n,
          in: path,
          required: true,
          schema: { type: integer, minimum: 0 },
        }
    put:
      operationId: putCloudPart
      x-sa-access: device
      summary: Upload one encrypted part (exactly part_size + 28 bytes; the last part the remainder + 28) from the object's owner device.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The object with its uploaded part count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: getCloudPart
      x-sa-access: participant
      summary: Download one encrypted part of a READY object (sender or JOINED receiver), charged to the sender's budget.
      responses:
        "200":
          description: The part as stored (nonce, ciphertext, tag).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/cloud/objects/{id}/seal:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: sealCloudObject
      x-sa-access: device
      summary: Mark a fully uploaded object READY (owner device); participants get CLOUD_UPDATED.
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/cloud/objects/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getCloudObject
      x-sa-access: participant
      summary: One cloud object for the sender or a JOINED receiver of its session.
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cloud/objects/{id}/received:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: receivedCloudObject
      x-sa-access: participant
      summary: A JOINED receiver has the whole file; once every joined receiver has, the object is deleted.
      responses:
        "200":
          description: The object (DELETED once every joined receiver has it).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/sessions/{id}/cloud:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: listSessionCloudObjects
      x-sa-access: participant
      summary: The live cloud objects of a session for its sender and JOINED receivers.
      responses:
        "200":
          description: Objects, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [objects]
                properties:
                  objects:
                    type: array
                    items: { $ref: "#/components/schemas/CloudObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
  responses:
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests. See the Retry-After header.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller may not do this (for example not the sender, or blocked).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown resource or no access (existence hidden).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The action conflicts with the current state (session_full, too_many_open_sessions, invalid_state).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: join_window_expired, session_not_accepting, session_expired, join_ticket_invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    CloudSettings:
      type: object
      required: [available, signed_in, enabled, consented, budget_bytes, used_bytes, max_budget_bytes, ttl_hours, pricing]
      properties:
        available: { type: boolean, description: Cloud Distribution is configured on this server. }
        signed_in: { type: boolean }
        enabled: { type: boolean }
        consented: { type: boolean }
        budget_bytes: { type: integer, format: int64, minimum: 0, description: Monthly budget (bytes uploaded plus downloaded). }
        used_bytes: { type: integer, format: int64, minimum: 0, description: Bytes used this calendar month (UTC). }
        max_budget_bytes: { type: integer, format: int64, minimum: 0 }
        ttl_hours: { type: integer, minimum: 0, description: How long an object is kept at most. }
        pricing:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CloudPricing" }]
    CloudPricing:
      type: object
      required: [currency]
      properties:
        currency: { type: string }
        storage_gb_month: { type: number, nullable: true }
        egress_gb: { type: number, nullable: true }
    CloudSettingsInput:
      type: object
      required: [enabled, consent]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        consent: { type: boolean, description: Required (true) the first time Cloud Distribution is turned on. }
        budget_bytes: { type: integer, format: int64, minimum: 0 }
    CloudEstimate:
      type: object
      required: [storage_bytes, egress_bytes, retention_hours, cost, budget_bytes, used_bytes, within_budget]
      properties:
        storage_bytes: { type: integer, format: int64 }
        egress_bytes: { type: integer, format: int64 }
        retention_hours: { type: integer }
        cost: { type: number, nullable: true, description: "null when no price is configured: clients show product.cost_unknown." }
        currency: { type: string }
        budget_bytes: { type: integer, format: int64 }
        used_bytes: { type: integer, format: int64 }
        within_budget: { type: boolean }
    CloudObject:
      type: object
      required: [id, session_id, file_id, status, paused, size, part_size, part_count, parts_uploaded, ciphertext_size, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        file_id: { type: string, format: uuid }
        status: { type: string, enum: [UPLOADING, READY, DELETED] }
        paused: { type: boolean, description: The sender's monthly budget is used up; uploads and downloads wait. }
        size: { type: integer, format: int64, minimum: 0, description: Plaintext file size. }
        part_size: { type: integer, minimum: 1, description: Plaintext bytes per part (the last part holds the remainder). }
        part_count: { type: integer, minimum: 1 }
        parts_uploaded: { type: integer, minimum: 0 }
        ciphertext_size: { type: integer, format: int64, minimum: 0, description: "size + 28 × part_count." }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          { type: string, description: Machine-readable code (docs/API.md §3). }
        message: { type: string }
        retry_after_s: { type: integer }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
    Ready:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
    PowChallenge:
      type: object
      required: [token, difficulty, expires_in]
      properties:
        token: { type: string }
        difficulty:
          {
            type: integer,
            description: Leading zero bits required in SHA-256(token + ":" + solution).,
          }
        expires_in: { type: integer }
    PowSolution:
      type: object
      required: [token, solution]
      properties:
        token: { type: string }
        solution: { type: string, maxLength: 32 }
    PowRequired:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [challenge]
          properties:
            challenge: { $ref: "#/components/schemas/PowChallenge" }
    CreateDeviceRequest:
      type: object
      required: [platform, transport]
      additionalProperties: false
      properties:
        platform:
          {
            type: string,
            minLength: 1,
            maxLength: 60,
            example: Chrome on macOS,
          }
        display_name: { type: string, minLength: 1, maxLength: 40 }
        transport:
          type: string
          enum: [cookie, body]
          description: Fixed for the device's lifetime. Refresh and reset answer the same way; "cookie" secrets never appear in a response body.
        pow: { $ref: "#/components/schemas/PowSolution" }
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_secret:
          {
            type: string,
            description: Native apps only. The Web sends no body and uses the sa_device cookie.,
          }
    UpdateDeviceRequest:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 40 }
    Device:
      type: object
      required: [id, kind, display_name, platform, created_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [anonymous, account] }
        display_name: { type: string }
        platform: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    DeviceSession:
      type: object
      required: [device, access_token, expires_in, server_time]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        access_token: { type: string }
        expires_in:
          {
            type: integer,
            description: Seconds until the access token expires.,
          }
        refresh_secret:
          { type: string, description: Present only with transport "body". }
        server_time: { type: string, format: date-time }
    WsTicket:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket: { type: string }
        expires_in: { type: integer }
    FileInput:
      type: object
      required: [name, size]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 0 }
        mime: { type: string, maxLength: 255 }
    CreateSessionRequest:
      type: object
      required: [files]
      additionalProperties: false
      properties:
        files:
          {
            type: array,
            minItems: 1,
            maxItems: 1000,
            items: { $ref: "#/components/schemas/FileInput" },
          }
        require_approval: { type: boolean, default: false }
    UpdateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        require_approval: { type: boolean }
        accepting_receivers:
          {
            type: boolean,
            enum: [false],
            description: false = Stop accepting. Reopening uses renew.,
          }
    SharedFile:
      type: object
      required: [id, name, size, mime]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer, format: int64 }
        mime: { type: string }
    JoinWindow:
      type: object
      required: [state, opened_at, ends_at, seq]
      properties:
        state:
          { type: string, enum: [OPEN, EXPIRED, ENDED_FULL, ENDED_BY_SENDER] }
        opened_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        seq: { type: integer }
    Capacity:
      type: object
      required: [joined, requested, max]
      properties:
        joined: { type: integer }
        requested: { type: integer }
        max: { type: integer }
    Participant:
      type: object
      required: [id, role, status, display_name, platform, signed_in]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [sender, receiver] }
        status:
          {
            type: string,
            enum: [REQUESTED, JOINED, LEFT, REMOVED, BLOCKED, REJECTED],
          }
        display_name: { type: string }
        platform: { type: string }
        signed_in: { type: boolean }
        security_words:
          { type: array, items: { type: string }, minItems: 3, maxItems: 3 }
        joined_via: { type: string, enum: [code, link] }
        request_reason: { type: string, enum: [approval, protected_mode] }
        joined_at: { type: string, format: date-time }
    PeerSummary:
      type: object
      required: [participant_id, display_name, platform, signed_in]
      properties:
        participant_id: { type: string, format: uuid }
        display_name: { type: string }
        platform: { type: string }
        signed_in: { type: boolean }
    SessionView:
      type: object
      required:
        [
          id,
          role,
          status,
          require_approval,
          total_bytes,
          file_count,
          protected_mode,
          expires_at,
          server_time,
        ]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [sender, receiver] }
        status:
          {
            type: string,
            enum:
              [
                WAITING,
                ACTIVE,
                COMPLETED,
                PARTIALLY_COMPLETED,
                CLOSED,
                EXPIRED,
                CANCELLED,
              ],
          }
        require_approval: { type: boolean }
        join_window: { $ref: "#/components/schemas/JoinWindow" }
        code:
          {
            type: string,
            description: "Sender only, while the join window is open.",
          }
        link_token:
          {
            type: string,
            description: "Sender only, while the join window is open.",
          }
        join_url:
          { type: string, description: Sender only; also the QR payload. }
        capacity: { $ref: "#/components/schemas/Capacity" }
        participants:
          {
            type: array,
            items: { $ref: "#/components/schemas/Participant" },
            description: Sender only (receivers).,
          }
        sender: { $ref: "#/components/schemas/PeerSummary" }
        me: { $ref: "#/components/schemas/Participant" }
        files:
          { type: array, items: { $ref: "#/components/schemas/SharedFile" } }
        total_bytes: { type: integer, format: int64 }
        file_count: { type: integer }
        protected_mode: { type: boolean }
        expires_at: { type: string, format: date-time }
        server_time: { type: string, format: date-time }
    OpenSession:
      type: object
      required:
        [
          id,
          status,
          created_at,
          expires_at,
          file_count,
          total_bytes,
          first_file_name,
          capacity,
          join_window,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [WAITING, ACTIVE] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        file_count: { type: integer }
        total_bytes: { type: integer, format: int64 }
        first_file_name: { type: string }
        capacity: { $ref: "#/components/schemas/Capacity" }
        join_window: { $ref: "#/components/schemas/JoinWindow" }
    OpenSessionList:
      type: object
      required: [sessions, max_open, server_time]
      properties:
        sessions:
          { type: array, items: { $ref: "#/components/schemas/OpenSession" } }
        max_open:
          {
            type: integer,
            description: "The caller's open-session cap: 2 for a guest device, 5 signed in.",
          }
        server_time: { type: string, format: date-time }
    JoinPreview:
      type: object
      required:
        [
          session_id,
          sender,
          files,
          total_bytes,
          file_count,
          require_approval,
          protected_mode,
          join_window_ends_at,
          join_ticket,
          join_ticket_expires_at,
          via,
          server_time,
        ]
      properties:
        session_id: { type: string, format: uuid }
        sender: { $ref: "#/components/schemas/PeerSummary" }
        files:
          { type: array, items: { $ref: "#/components/schemas/SharedFile" } }
        total_bytes: { type: integer, format: int64 }
        file_count: { type: integer }
        require_approval: { type: boolean }
        protected_mode:
          {
            type: boolean,
            description: True when this code join will wait for approval because of protected mode.,
          }
        join_window_ends_at: { type: string, format: date-time }
        join_ticket: { type: string }
        join_ticket_expires_at: { type: string, format: date-time }
        via: { type: string, enum: [code, link] }
        existing_status:
          {
            type: string,
            description: Set when the caller already has a participant in this session.,
          }
        server_time: { type: string, format: date-time }
    JoinResult:
      type: object
      required: [session_id, participant, server_time]
      properties:
        session_id: { type: string, format: uuid }
        participant: { $ref: "#/components/schemas/Participant" }
        server_time: { type: string, format: date-time }
    TurnCredentials:
      type: object
      required: [username, credential, uris, ttl, expires_at]
      properties:
        username: { type: string }
        credential: { type: string }
        uris: { type: array, items: { type: string } }
        ttl: { type: integer }
        expires_at: { type: string, format: date-time }
    TransferStatus:
      type: string
      enum:
        [
          PENDING,
          CONNECTING,
          TRANSFERRING,
          PAUSED,
          DISCONNECTED,
          RECONNECTING,
          RESUMING,
          COMPLETED,
          FAILED,
          CANCELLED,
        ]
    Transfer:
      type: object
      required:
        [
          id,
          session_id,
          participant_id,
          file_id,
          status,
          verified_bytes,
          size,
          route,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        participant_id: { type: string, format: uuid }
        file_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/TransferStatus" }
        verified_bytes: { type: integer, format: int64 }
        size: { type: integer, format: int64 }
        route: { type: string, enum: [direct, relay, cloud], nullable: true }
        updated_at: { type: string, format: date-time }
    TransferPeer:
      type: object
      required: [participant_id, status]
      properties:
        participant_id: { type: string, format: uuid }
        status:
          {
            type: string,
            enum: [REQUESTED, JOINED, LEFT, REMOVED, BLOCKED, REJECTED],
          }
        capability_hash:
          {
            type: string,
            description: Hex SHA-256 of a JOINED receiver's transfer capability.,
          }
    TransferList:
      type: object
      required: [role, transfers, server_time]
      properties:
        role: { type: string, enum: [sender, receiver] }
        transfers:
          { type: array, items: { $ref: "#/components/schemas/Transfer" } }
        peers:
          { type: array, items: { $ref: "#/components/schemas/TransferPeer" } }
        capability:
          {
            type: string,
            description: The calling receiver's transfer capability (docs/TRANSFER_PROTOCOL.md).,
          }
        server_time: { type: string, format: date-time }
    TransferReport:
      type: object
      required: [status, verified_bytes]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/TransferStatus" }
        verified_bytes: { type: integer, format: int64, minimum: 0 }
        route: { type: string, enum: [direct, relay, cloud] }
    TransferAction:
      type: object
      additionalProperties: false
      properties:
        capability: { type: string }
    Base64Url:
      type: string
      pattern: "^[A-Za-z0-9_-]*$"
      description: Binary data as base64url without padding.
    PublicKey:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: X25519 public key, exactly 32 bytes, base64url without padding.
    VerifyKey:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: Ed25519 public key of an ADK version (32 bytes, base64url without padding). verify_key(v) is derived from ADK(v) with HKDF-SHA256 info "sa-keyver-sign-v1".
    Signature:
      type: string
      pattern: "^[A-Za-z0-9_-]{86}$"
      description: Ed25519 signature (64 bytes, base64url without padding).
    WrappedBlob:
      type: string
      pattern: "^[A-Za-z0-9_-]+$"
      maxLength: 5462
      description: Opaque wrapped key (at most 4 KB decoded), base64url without padding. The server cannot unwrap it.
    CredentialsRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        password:
          {
            type: string,
            maxLength: 512,
            description: Sign-up requires 10 to 128 characters that are not a common password.,
          }
        add_device:
          type: boolean
          default: true
          description: "Add this device to the account (dl true; required for keys, history, and Clipboard Sync). A not-added device's account session ends 24 h after sign-in."
        copy_history:
          {
            type: boolean,
            default: false,
            description: Only meaningful with add_device. The client imports its local history with POST /v1/history/entries.,
          }
    AccountRef:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
    AccountDeviceRef:
      type: object
      required: [id, added]
      properties:
        id: { type: string, format: uuid }
        added: { type: boolean }
    AuthResult:
      type: object
      required: [access_token, expires_in, account, device]
      properties:
        access_token: { type: string, description: Carries acct and dl. }
        expires_in: { type: integer }
        account: { $ref: "#/components/schemas/AccountRef" }
        device: { $ref: "#/components/schemas/AccountDeviceRef" }
    AccountToken:
      type: object
      required: [access_token, expires_in, device]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        device: { $ref: "#/components/schemas/AccountDeviceRef" }
    Me:
      type: object
      required: [id, email, created_at, device, history_sync]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        created_at: { type: string, format: date-time }
        device: { $ref: "#/components/schemas/AccountDeviceRef" }
        history_sync: { type: boolean }
    AccountDevice:
      type: object
      required: [id, name, platform, added, current, last_seen_at, created_at, has_key]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        added: { type: boolean }
        current: { type: boolean }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        has_key: { type: boolean, description: The device registered a wrapping public key. }
    Argon2Spec:
      type: object
      required: [m, t, p]
      additionalProperties: false
      properties:
        m: { type: integer, minimum: 8192, maximum: 1048576, description: Memory in KiB. }
        t: { type: integer, minimum: 1, maximum: 10 }
        p: { type: integer, minimum: 1, maximum: 4 }
    RecoveryInfo:
      type: object
      required: [public_key, salt, params, signature]
      properties:
        public_key: { $ref: "#/components/schemas/PublicKey" }
        salt: { $ref: "#/components/schemas/Base64Url" }
        params: { $ref: "#/components/schemas/Argon2Spec" }
        signature:
          allOf:
            - $ref: "#/components/schemas/Signature"
          nullable: true
          description: >-
            The setup-time signature by ADK(1) over "sa-recoverykey-v1|" + b64u(public_key). A rotating client verifies it with the
            verify_key(1) it derives from its own ADK(1) before wrapping a new ADK to public_key, and refuses otherwise. Null for legacy
            accounts set up before it existed (clients refuse to rotate). The recovery public key never changes after setup
            (docs/ADR/0015-authenticated-recovery-key.md).
    DeviceKey:
      type: object
      required: [device_id, public_key, key_version, proof]
      description: An added device and its wrapping key; public_key, key_version, and proof are null until the device registers (once it holds the ADK).
      properties:
        device_id: { type: string, format: uuid }
        public_key:
          allOf:
            - $ref: "#/components/schemas/PublicKey"
          nullable: true
        key_version: { type: integer, minimum: 1, nullable: true, description: The ADK version whose signing key made proof. }
        proof:
          allOf:
            - $ref: "#/components/schemas/Signature"
          nullable: true
          description: Signature by ADK(key_version) over "sa-devkey-v1|<device_id>|<key_version>|<b64u(public_key)>"; clients verify it before wrapping to the key.
    PendingBlob:
      type: object
      required: [key_version, blob, from_device_id]
      properties:
        key_version: { type: integer }
        blob: { $ref: "#/components/schemas/WrappedBlob" }
        from_device_id: { type: string, format: uuid }
    KeysState:
      type: object
      required: [key_version, recovery, devices, pending, rotation_due]
      properties:
        key_version: { type: integer, minimum: 0, description: 0 means no ADK yet. }
        recovery:
          allOf:
            - $ref: "#/components/schemas/RecoveryInfo"
          nullable: true
        devices:
          type: array
          description: Every added device of the account.
          items: { $ref: "#/components/schemas/DeviceKey" }
        pending:
          type: array
          description: ADK versions wrapped for the caller by rotations, until acknowledged.
          items: { $ref: "#/components/schemas/PendingBlob" }
        rotation_due:
          type: boolean
          description: >-
            True once an added device with a registered wrapping key has left the account (revoke, sign-out, password reset or
            change, identity reset, refresh-secret reuse, expiry) since the last rotation; a ready client rotates. A successful
            rotation clears it (docs/ADR/0014-current-version-proofs.md).
    KeysSetupRequest:
      type: object
      required: [recovery_public_key, salt, params, recovery_blob, verify_key, recovery_anchor, recovery_key_signature]
      additionalProperties: false
      properties:
        recovery_public_key: { $ref: "#/components/schemas/PublicKey" }
        salt: { allOf: [{ $ref: "#/components/schemas/Base64Url" }], description: 16 to 64 bytes. }
        params: { $ref: "#/components/schemas/Argon2Spec" }
        recovery_blob: { $ref: "#/components/schemas/WrappedBlob" }
        verify_key: { allOf: [{ $ref: "#/components/schemas/VerifyKey" }], description: verify_key(1). }
        recovery_anchor:
          allOf: [{ $ref: "#/components/schemas/RecoveryAnchor" }]
        recovery_key_signature:
          allOf: [{ $ref: "#/components/schemas/Signature" }]
          description: Ed25519 by the signing key of ADK(1) over "sa-recoverykey-v1|" + b64u(recovery_public_key); verified with verify_key.
    KeyVersion:
      type: object
      required: [key_version]
      properties:
        key_version: { type: integer }
    RecoveryAnchor:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: >-
        HMAC-SHA256(key = HKDF-SHA256(recovery_seed, info "sa-recovery-anchor-v1"), msg = "sa-anchor-v1|" + b64u(verify_key(1))),
        32 bytes base64url. Lets a recovery-phrase holder authenticate verify_key(1) without trusting the server.
    RecoveryBlob:
      type: object
      required: [key_version, recovery_blob, salt, params, recovery_anchor]
      properties:
        key_version: { type: integer }
        recovery_blob: { $ref: "#/components/schemas/WrappedBlob" }
        salt: { $ref: "#/components/schemas/Base64Url" }
        params: { $ref: "#/components/schemas/Argon2Spec" }
        recovery_anchor:
          allOf:
            - $ref: "#/components/schemas/RecoveryAnchor"
          nullable: true
          description: Null for legacy accounts whose keys predate key verification (recovery cannot be verified; clients refuse it).
    DeviceBlob:
      type: object
      required: [device_id, blob]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        blob: { $ref: "#/components/schemas/WrappedBlob" }
    KeysRotateRequest:
      type: object
      required: [key_version, recovery_blob, chain_blob, device_blobs, verify_key, signature]
      additionalProperties: false
      properties:
        key_version: { type: integer, description: Must be the current version + 1. }
        recovery_blob: { $ref: "#/components/schemas/WrappedBlob" }
        chain_blob: { allOf: [{ $ref: "#/components/schemas/WrappedBlob" }], description: ADK(v-1) wrapped with ADK(v). }
        device_blobs:
          type: array
          maxItems: 100
          description: >-
            Exactly one blob for every other added device whose registered proof is by the current version v (devices with no key
            or an older proof get none and must pair again); a blob for the caller itself is accepted as a safety copy and
            delivered through its pending list.
          items: { $ref: "#/components/schemas/DeviceBlob" }
        verify_key: { allOf: [{ $ref: "#/components/schemas/VerifyKey" }], description: verify_key(v+1). }
        signature:
          allOf: [{ $ref: "#/components/schemas/Signature" }]
          description: >-
            By the signing key of the current version v over
            "sa-rotate-v1|" + (v+1) + "|" + b64u(verify_key(v+1)) + "|" + b64u(SHA-256(chain_blob bytes)).
    DevicesChanged:
      description: 409 devices_changed body; both lists are always present (possibly empty), sorted.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [missing, unexpected]
          properties:
            missing:
              type: array
              description: Other added devices whose registered proof is by the current version and that got no blob.
              items: { type: string, format: uuid }
            unexpected:
              type: array
              description: Blobs for devices that must not get one - no registered key, a proof by an older version, or not (or no longer) an added device of the account.
              items: { type: string, format: uuid }
    ChainLink:
      type: object
      required: [key_version, blob]
      properties:
        key_version: { type: integer }
        blob: { $ref: "#/components/schemas/WrappedBlob" }
    KeyVersionInfo:
      type: object
      required: [key_version, verify_key, signature]
      properties:
        key_version: { type: integer, minimum: 1 }
        verify_key:
          allOf:
            - $ref: "#/components/schemas/VerifyKey"
          nullable: true
          description: Null only for legacy accounts whose keys predate key verification.
        signature:
          allOf:
            - $ref: "#/components/schemas/Signature"
          nullable: true
          description: The rotation signature by version key_version-1 (null for version 1 and for legacy rows).
    Pairing:
      type: object
      required: [pairing_id, code, expires_at]
      properties:
        pairing_id: { type: string, format: uuid }
        code: { type: string, description: 128 random bits as base64url (22 characters). }
        expires_at: { type: string, format: date-time }
    PairingPeer:
      type: object
      required: [pairing_id, ephemeral_public_key, device_id, device_name]
      properties:
        pairing_id: { type: string, format: uuid }
        ephemeral_public_key: { $ref: "#/components/schemas/PublicKey" }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
    PairingWrapRequest:
      type: object
      required: [key_version, sender_public_key, blob]
      additionalProperties: false
      properties:
        key_version: { type: integer, minimum: 1 }
        sender_public_key: { $ref: "#/components/schemas/PublicKey" }
        blob: { $ref: "#/components/schemas/WrappedBlob" }
    PairingStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [waiting, ready, expired] }
        key_version: { type: integer }
        sender_public_key: { $ref: "#/components/schemas/PublicKey" }
        blob: { $ref: "#/components/schemas/WrappedBlob" }
    HistoryEntryRequest:
      type: object
      required: [entry_id, key_version, nonce, ciphertext]
      additionalProperties: false
      properties:
        entry_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: "Client-generated, lowercase canonical 8-4-4-4-12 form (part of the AAD; 400 invalid_request otherwise)."
        key_version: { type: integer, minimum: 1, description: "The account's current key version (409 key_version_conflict otherwise)." }
        nonce: { allOf: [{ $ref: "#/components/schemas/Base64Url" }], description: 12 bytes. }
        ciphertext: { allOf: [{ $ref: "#/components/schemas/Base64Url" }], description: "AES-256-GCM ciphertext and tag, at most 64 KB decoded." }
    HistoryEntry:
      type: object
      required: [entry_id, seq, key_version, origin_device_id, created_at, deleted]
      properties:
        entry_id: { type: string, format: uuid, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        seq: { type: integer, format: int64 }
        key_version: { type: integer }
        nonce: { allOf: [{ $ref: "#/components/schemas/Base64Url" }], description: Absent on tombstones. }
        ciphertext: { allOf: [{ $ref: "#/components/schemas/Base64Url" }], description: Absent on tombstones. }
        origin_device_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        deleted: { type: boolean }
    HistoryPage:
      type: object
      required: [entries, next_after]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/HistoryEntry" }
        next_after: { type: integer, format: int64 }
    ClipboardEventRequest:
      type: object
      required: [event_id, key_version, nonce, ciphertext, payload_size]
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: "Client-generated; the idempotency key. Lowercase canonical 8-4-4-4-12 form (part of the AAD; 400 invalid_request otherwise)."
        key_version: { type: integer, minimum: 1, description: "The account's current key version (409 key_version_conflict otherwise)." }
        nonce: { allOf: [{ $ref: "#/components/schemas/Base64Url" }], description: 12 bytes. }
        ciphertext:
          allOf: [{ $ref: "#/components/schemas/Base64Url" }]
          description: "AES-256-GCM ciphertext and tag under the clipboard-v1 subkey, AAD <event_id>|<key_version>; exactly payload_size + 16 bytes decoded (400 invalid_request otherwise), so 17 to 262160 bytes (413 payload_too_large above)."
        payload_size: { type: integer, minimum: 1, maximum: 262144, description: "UTF-8 byte length of the plaintext (413 payload_too_large above 262144); the decoded ciphertext must be exactly payload_size + 16 bytes." }
        event_type: { type: string, enum: [TEXT], default: TEXT }
        mime_type: { type: string, enum: [text/plain], default: text/plain }
    ClipboardEventCreated:
      type: object
      required: [seq, created_at, expires_at]
      properties:
        seq: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ClipboardEvent:
      type: object
      required: [event_id, seq, origin_device_id, event_type, mime_type, key_version, nonce, ciphertext, payload_size, created_at, expires_at, deleted]
      properties:
        event_id: { type: string, format: uuid, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        seq: { type: integer, format: int64 }
        origin_device_id: { type: string, format: uuid }
        event_type: { type: string, enum: [TEXT] }
        mime_type: { type: string, enum: [text/plain] }
        key_version: { type: integer }
        nonce: { type: string, nullable: true, description: "Base64url, 12 bytes; null on tombstones." }
        ciphertext: { type: string, nullable: true, description: Base64url; null on tombstones. }
        payload_size: { type: integer }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        deleted: { type: boolean }
    ClipboardEventPage:
      type: object
      required: [events, next_cursor]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/ClipboardEvent" }
        next_cursor: { type: integer, format: int64, description: "The seq of the last event returned, or the cursor sent when there are none." }
    ClipboardHistory:
      type: object
      required: [events, cursor]
      properties:
        events:
          type: array
          description: Live events, newest first.
          items: { $ref: "#/components/schemas/ClipboardEvent" }
        cursor: { type: integer, format: int64, description: "The account's highest seq (0 if none); follow GET /v1/clipboard/events from it." }
    ClipboardSettings:
      type: object
      required: [paused, retention_days, sensitive_skip]
      additionalProperties: false
      properties:
        paused: { type: boolean, description: "When true, POST /v1/clipboard/events answers 409 clipboard_paused." }
        retention_days: { type: integer, minimum: 1, maximum: 7 }
        sensitive_skip: { type: boolean, description: Clients skip capturing possibly sensitive text (best effort). }
